# Builds of the 见微测振 app that need Apple or Windows machines.
#  ios:      XcodeGen project -> unsigned .ipa (for sideloading with your own
#            Apple ID, e.g. Sideloadly/AltStore) + simulator run screenshots.
#  windows:  runs the committed Windows zip on a real Windows machine
#            (--selftest: page, 3D model and native bridge load).
#  publish:  commits the .ipa and the run evidence back to the branch.
name: App builds
on:
  push:
    branches: ['claude/**']
    paths: ['06_软件与FPGA/mobile_app/**', '.github/workflows/app-builds.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  APP: 06_软件与FPGA/mobile_app
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VER=$(sed -n 's/^VERSION_NAME=//p' "$APP/tools/build_apk.sh")" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd "$APP/ios" && xcodegen generate
      - name: Unsigned device build (.ipa)
        working-directory: ${{ env.APP }}/ios
        run: |
          xcodebuild -project JianweiVibro.xcodeproj -target JianweiVibro -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -5
          rm -rf Payload && mkdir Payload && cp -R build/Release-iphoneos/JianweiVibro.app Payload/
          mkdir -p "$RUNNER_TEMP/out" && zip -qry "$RUNNER_TEMP/out/JianweiVibro-$VER-ios-unsigned.ipa" Payload
          ls -l "$RUNNER_TEMP/out"
      - name: Simulator build and screenshots
        working-directory: ${{ env.APP }}/ios
        run: |
          xcodebuild -project JianweiVibro.xcodeproj -target JianweiVibro -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build | tail -3
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/JianweiVibro.app
          for s in connect home measure device; do
            if [ $s = connect ]; then xcrun simctl launch "$UDID" com.jianwei.vibro; else xcrun simctl launch "$UDID" com.jianwei.vibro -shot $s; fi
            sleep 12
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/out/ios_$s.png"
            xcrun simctl terminate "$UDID" com.jianwei.vibro || true
          done
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: '${{ runner.temp }}/out' }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Windows build (--selftest)
        shell: bash
        run: |
          VER=$(sed -n 's/^VERSION_NAME=//p' "$APP/tools/build_apk.sh")
          mkdir -p /c/jw /c/jwout && unzip -q "$APP/dist/JianweiVibro-$VER-windows-x64.zip" -d /c/jw
          cd /c/jw/JianweiVibro && timeout 90 ./JianweiVibro.exe --selftest 'C:\jwout\windows_selftest.json'; echo "exit $?"
          python - <<'PY'
          import base64, json
          d = json.load(open(r'C:\jwout\windows_selftest.json', encoding='utf-8'))
          png = d.pop('png', None)
          if png: open(r'C:\jwout\windows_hero.png', 'wb').write(base64.b64decode(png.split(',', 1)[1]))
          json.dump(d, open(r'C:\jwout\windows_selftest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(d, ensure_ascii=False, indent=2))
          assert d['connect'] and d['hero'] and 'discover' in d['bridge'] and 'main' in d['boards']
          PY
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'C:\jwout' }

  publish:
    needs: [ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/download-artifact@v4
        with: { path: '${{ runner.temp }}/a' }
      - name: Commit the iOS package and run evidence
        run: |
          VER=$(sed -n 's/^VERSION_NAME=//p' "$APP/tools/build_apk.sh")
          CI="15_手机APP_20261025/构建验证"
          rm -f "$APP"/dist/JianweiVibro-*-ios-unsigned.ipa && mkdir -p "$CI"
          cp "$RUNNER_TEMP/a/ios/JianweiVibro-$VER-ios-unsigned.ipa" "$APP/dist/"
          cp "$RUNNER_TEMP"/a/ios/*.png "$RUNNER_TEMP"/a/windows/* "$CI/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$APP/dist" "$CI"
          git diff --cached --quiet || git commit -m "APP $VER: iOS unsigned IPA and iOS/Windows run screenshots (CI ${GITHUB_RUN_ID})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
