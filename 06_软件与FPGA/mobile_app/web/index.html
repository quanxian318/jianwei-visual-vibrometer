<style>
  #splash { position: fixed; inset: 0; z-index: 100; background: #f3f4f7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .5s ease, transform .5s ease; }
  #splash.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
  #splash .t { color: #0d1220; font: 600 22px system-ui, sans-serif; letter-spacing: .18em; }
  #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(13,18,32,.08); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg,#3e63f5,#7c5cf6); animation: sp 1.1s ease-in-out infinite; }
  @keyframes sp { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
</style>
</head>

<div id="splash"><svg width="96" height="96" viewBox="0 0 108 108"><defs><linearGradient id="sb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2140"/><stop offset="1" stop-color="#0a0d1a"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7cff"/><stop offset="1" stop-color="#a27bff"/></linearGradient></defs><rect width="108" height="108" rx="30" fill="url(#sb)"/><circle cx="54" cy="54" r="29" fill="none" stroke="url(#sg)" stroke-width="7"/><circle cx="54" cy="54" r="16" fill="none" stroke="url(#sg)" stroke-width="2.5" opacity=".45"/><path d="M14 54c6 0 8-14 14-14s8 28 14 28 6-30 12-30 6 30 12 30 8-28 14-28 8 14 14 14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="54" r="4" fill="#ffffff"/></svg><div class="t">见微测振</div><div class="bar"><i></i></div></div>
