# Kernel options needed by the carrier board (add as a config fragment in
# project-spec/meta-user/recipes-kernel/linux/linux-xlnx/ and list it in the bbappend).
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_XILINX=y
CONFIG_SPI=y
CONFIG_SPI_XILINX=y
CONFIG_SPI_SPIDEV=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_OF_PLATFORM=y
CONFIG_SERIAL_8250_NR_UARTS=4
CONFIG_SERIAL_8250_RUNTIME_UARTS=4
CONFIG_UIO=y
# vibmond maps the PDM microphone receiver (no driver) through /dev/mem.
CONFIG_DEVMEM=y
CONFIG_UIO_PDRV_GENIRQ=y
CONFIG_INPUT_EVDEV=y
CONFIG_HID_MULTITOUCH=y
CONFIG_USB_HID=y
CONFIG_FB=y
CONFIG_DRM_FBDEV_EMULATION=y
